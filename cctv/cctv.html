<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f19">
    <title>Live CCTV Monitor — SAFEGUARD AI</title>
    <meta name="description" content="Live CCTV camera feed for SAFEGUARD AI industrial safety monitoring.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      window.addEventListener('load', function () {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap';
        document.head.appendChild(l);
      });
    </script>
    <style>
      :root { --ink:#0b0f19; --accent:#38bdf8; --danger:#ef4444; --border:rgba(255,255,255,0.1); }
      * { box-sizing:border-box; margin:0; padding:0; }
      html { background:var(--ink); }
      body {
        display:flex; flex-direction:column; height:100vh; padding:24px;
        background:
          radial-gradient(600px 400px at 10% -5%, rgba(56,189,248,.10), transparent 60%),
          var(--ink);
        color:#94a3b8; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        -webkit-font-smoothing:antialiased;
      }
      .icon { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .header-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
      .back-link {
        display:inline-flex; align-items:center; gap:8px;
        padding:9px 14px; border-radius:10px; text-decoration:none;
        font-size:.875rem; font-weight:600; color:var(--accent);
        border:1px solid var(--border); background:rgba(255,255,255,.05);
        transition:background .18s;
      }
      .back-link:hover { background:rgba(255,255,255,.1); }
      .live-tag {
        display:inline-flex; align-items:center; gap:9px;
        padding:9px 14px; border-radius:10px;
        font-size:.875rem; font-weight:700; color:#fca5a5;
        border:1px solid rgba(239,68,68,.4); background:rgba(239,68,68,.15);
      }
      .live-dot { position:relative; display:inline-flex; width:10px; height:10px; }
      .live-dot::before { content:""; position:absolute; inset:0; border-radius:999px; background:var(--danger); opacity:.75; animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite; }
      .live-dot::after { content:""; position:relative; width:10px; height:10px; border-radius:999px; background:var(--danger); }
      @keyframes ping { 75%,100% { transform:scale(2.4); opacity:0; } }
      .video-wrapper {
        position:relative; display:flex; flex:1; align-items:center; justify-content:center;
        overflow:hidden; border-radius:18px; border:1px solid var(--border); background:#000;
      }
      .corner { position:absolute; width:24px; height:24px; pointer-events:none; }
      .corner.tl { top:16px; left:16px; border-top:2px solid rgba(56,189,248,.6); border-left:2px solid rgba(56,189,248,.6); }
      .corner.tr { top:16px; right:16px; border-top:2px solid rgba(56,189,248,.6); border-right:2px solid rgba(56,189,248,.6); }
      .corner.bl { bottom:16px; left:16px; border-bottom:2px solid rgba(56,189,248,.6); border-left:2px solid rgba(56,189,248,.6); }
      .corner.br { bottom:16px; right:16px; border-bottom:2px solid rgba(56,189,248,.6); border-right:2px solid rgba(56,189,248,.6); }
      .cam-label { position:absolute; top:16px; left:16px; font-family:'JetBrains Mono',monospace; font-size:12px; color:rgba(56,189,248,.75); }
      #webcam-feed { height:100%; width:100%; object-fit:contain; }
      #cam-status { position:absolute; font-family:'JetBrains Mono',monospace; font-size:.875rem; color:#64748b; }
    </style>
</head>
<body>
    <div class="header-bar">
        <a href="/" class="back-link">
          <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Return to Dashboard
        </a>
        <span class="live-tag"><span class="live-dot"></span>LIVE CCTV STREAM</span>
    </div>

    <div class="video-wrapper">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <span class="cam-label">CAM-04 · ZONE ALPHA</span>
        <video id="webcam-feed" autoplay playsinline muted></video>
        <p id="cam-status">Requesting camera access…</p>
    </div>

    <script>
        const statusEl = document.getElementById('cam-status');
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                const v = document.getElementById('webcam-feed');
                v.srcObject = stream;
                if (statusEl) statusEl.style.display = 'none';
            })
            .catch(err => {
                console.error("Camera access failed:", err);
                if (statusEl) statusEl.textContent = 'Camera access denied or unavailable.';
            });
    </script>
</body>
</html>
